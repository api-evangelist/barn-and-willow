name: Barn & Willow
description: >-
  Barn & Willow is a direct-to-consumer home furnishings brand specializing in
  made-to-measure window treatments — custom drapery, curtains, roman shades and
  blinds in natural fabrics such as linen, cotton and velvet. The company sells
  online at barnandwillow.com, a Shopify-hosted storefront, offering free fabric
  swatches, measuring guides and design consultations. Surfaced as a portfolio
  company of 500 Global and added to the API Evangelist network, the storefront
  exposes a real agentic-commerce surface: a Universal Commerce Protocol (UCP)
  merchant profile and hosted MCP endpoint for agent-driven shopping, Shopify
  Customer Account OAuth 2.0 / OpenID Connect authentication, and an llms.txt
  agent-instructions document.
